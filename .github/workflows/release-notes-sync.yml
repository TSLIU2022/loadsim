name: 发布说明同步

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-notes/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-notes-sync.yml"
      - "scripts/compose_release_body.sh"
      - "AGENTS.md"
  workflow_run:
    workflows:
      - "发布"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-notes-sync-${{ github.repository }}
  # 串行执行可保证较新的说明最后写入；取消运行中的任务可能恰好中断在更新 API 之后。
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: 同步已有发布说明
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execFileSync } = require('child_process');
            const { owner, repo } = context.repo;
            const notesDir = path.join('.github', 'release-notes');
            const files = fs.readdirSync(notesDir)
              .filter((file) => file.endsWith('.md') && file !== 'README.md')
              .sort();

            fs.mkdirSync('dist', { recursive: true });

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 },
            );
            const publishedReleases = releases.filter((release) => !release.draft);
            const releasesByTag = new Map(
              publishedReleases.map((release) => [release.tag_name, release]),
            );
            const publishedTagsFile = path.join('dist', 'published-release-tags.txt');
            fs.writeFileSync(
              publishedTagsFile,
              publishedReleases.map((release) => release.tag_name).join('\n') + '\n',
              { encoding: 'utf8', mode: 0o600 },
            );

            const escapeRegex = (value) =>
              value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const versionPattern =
              'v(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)(?:-beta\\.(?:0|[1-9][0-9]*))?';
            const comparisonSection = (body) => {
              const lines = body.split(/\r?\n/);
              let start = -1;
              for (let index = 0; index < lines.length; index += 1) {
                if (lines[index] === '## 变更对比') {
                  start = index + 1;
                }
              }
              if (start < 0) {
                return '';
              }
              let end = lines.length;
              for (let index = start; index < lines.length; index += 1) {
                if (lines[index].startsWith('## ')) {
                  end = index;
                  break;
                }
              }
              return lines.slice(start, end).join('\n');
            };

            for (const file of files) {
              const tag = file.replace(/\.md$/, '');
              const release = releasesByTag.get(tag);
              if (!release) {
                core.info(`跳过未发布标签: ${tag}`);
                continue;
              }

              const existingBody = release.body || '';
              const existingComparisonSection = comparisonSection(existingBody);
              const comparePattern = new RegExp(
                `^\\*\\*完整变更\\*\\*: https://github\\.com/` +
                `${escapeRegex(owner)}/${escapeRegex(repo)}/compare/` +
                `(${versionPattern})\\.\\.\\.${escapeRegex(tag)}$`,
                'm',
              );
              const compareMatch = existingComparisonSection.match(comparePattern);
              let previousTagOverrideSet = false;
              let previousTagOverride = '';

              if (compareMatch) {
                previousTagOverrideSet = true;
                previousTagOverride = compareMatch[1];
              } else if (
                existingComparisonSection
                  .split('\n')
                  .some((line) =>
                    line === '当前版本是首个正式版，变更范围为当前仓库全部代码。' ||
                    line === '当前 beta 版本之前没有可用于对比的已发布标签。'
                  )
              ) {
                previousTagOverrideSet = true;
              }

              const output = path.join('dist', `${tag}.md`);
              const composeEnvironment = {
                ...process.env,
                GITHUB_REPOSITORY: `${owner}/${repo}`,
                PUBLISHED_TAGS_FILE: publishedTagsFile,
              };
              if (previousTagOverrideSet) {
                composeEnvironment.PREVIOUS_TAG_OVERRIDE_SET = 'true';
                composeEnvironment.PREVIOUS_TAG_OVERRIDE = previousTagOverride;
              }

              try {
                execFileSync(
                  'bash',
                  ['scripts/compose_release_body.sh', tag, output],
                  {
                    stdio: 'inherit',
                    env: composeEnvironment,
                  },
                );
              } catch (error) {
                if (!previousTagOverrideSet) {
                  throw error;
                }
                core.warning(
                  `发布页 ${tag} 记录的历史 compare 基线无效，` +
                  '将按当前已发布版本重新计算。',
                );
                delete composeEnvironment.PREVIOUS_TAG_OVERRIDE_SET;
                delete composeEnvironment.PREVIOUS_TAG_OVERRIDE;
                execFileSync(
                  'bash',
                  ['scripts/compose_release_body.sh', tag, output],
                  {
                    stdio: 'inherit',
                    env: composeEnvironment,
                  },
                );
              }

              const body = fs.readFileSync(output, 'utf8');
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                body,
              });

              core.info(`已同步发布说明: ${tag}`);
            }
